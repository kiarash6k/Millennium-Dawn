l_english:
 # 0
 industrial_complex: "Civilian Industry"
 industrial_complex_plural: "Civilian Industries"
 industrial_complex_desc: "This building provides the state with industry for production of civilian goods or construction of new buildings. Can be converted to military industry if needed.\n\nProvides the state with:\nBase Number of Required Workers: §Y206K§!\nBase GDP Output per §YCivilian Industry§!: $§Y17.5 Billion§!\nBase Energy Consumption: §R-0.5§! GW\n"
 # 1
 arms_factory: "Military Industry"
 arms_factory_plural: "Military Industries"
 arms_factory_desc: "This building provides the state with industry for production of new military equipment. Can be converted to civilian industry if needed.\n\nProvides the state with:\nBase Number of Required Workers: §Y18.8K§!\nBase GDP Output per §YMilitary Industry§!: $§Y1.5 Billion§!\nBase Energy Consumption: §R-0.5§! GW"
 # 3
 internet_station: "Network Infrastructure"
 internet_station_plural: "Network Infrastructure"
 internet_station_desc: "§YNetwork Infrastructure§! are tall structures used in the telecommunication and radio communication fields in order to push transmissions across great distances or underground fiber optic cables and cloud computing systems.\n\nProvides the state with:\nBase Number of Required Workers: §Y12K§!\nBase GDP Output per §YNetwork Infrastructure§!: $§Y3.5 Billion§!\n\nEach level of §YNetwork Infrastructure§! improves local productivity growth speed by §G+5.00%§!.\nEach level of §YNetwork Infrastructure§! reduces the duration of §YInternational Investments§! by §G-5.00%§!."
 # 4
 dockyard: "Naval Yard"
 dockyard_plural: "Naval Yards"
 dockyard_desc: "§YNaval Yards§! are representative of a state's ability to produce military vessels of all sorts ranging from §YPatrol Boats§!, §YConvoys§!, §YDestroyers§!, §YCarriers§! and more.\n\nProvides the state with:\nBase Number of Required Workers: §Y18.8K§!\nBase GDP Output per §YNaval Yard§!: $§Y1.5 Billion§!\nBase Energy Consumption: §R-0.5§! GW"
 # 5
 air_base_desc: "An §YAir Base§! is a storage facility and a military compound for the deployment and preparation of your air forces. It can be stacked to level ten adding additional capacity of §Y50§! Planes per level."
 # 6
 radar_station_desc: "§YRadar Stations§! allows you to gain intel on enemy troops in nearby states. It consists of various radars and sensors, as well as intel assets and capacity to analyse the evolving situation.\nA higher level will increase it's effective range.\nIt's radars also provides the state with better detection of enemy air forces, giving your aircraft a better chance to engage them.\nIn addition the radars are increasing detection of enemy fleets at sea."
 # 7
 anti_air_building: "SHORAD Sites"
 anti_air_building_plural: "SHORAD Sites"
 anti_air_building_desc: "§YSHORAD Sites§! (Short Range Air Defense) are complexes and groups of anti-aircraft weapons and tactics that handle air defence against low-altitude air threats. These sites work together to divide airspace into defensible areas providing local military targets and infrastructure air coverage from everything ranging from helicopters to low-flying aircraft to jets."
 # 8
 nuclear_reactor_desc: "This building converts nuclear energy into electrical energy, consuming moderately enriched uranium in the process.\n\nProvides the state with:\nBase Number of Required Workers: §Y115K§!\nBase GDP Output per §YNuclear Reactor§!: $§Y4 Billion§!\nBase Power Gain: §G+5§! GW\n"
 # 9
 renewable_energy_infra: "Renewable Energy Infrastructure"
 renewable_energy_infra_plural: "Renewable Energy Infrastructure"
 renewable_energy_infra_desc: "§YRenewable Energy Infrastructure§! is a catch-all for all renewable energy sources. These include but are not limited to; solar parks, wind turbines, biofuel refineries, charcoal plants, biofuel power plants, and more. As such, it uses renewable sources and produces fuel from those sources.\n\nProvides the state with:\nBase Number of Required Workers: §Y22.5K§!\nBase GDP Output per §YRenewable Energy Infrastructure§!: $§Y2 Billion§!\nBase Power Gain: §G+0.5§! GW\n"
 renewable_energy_infra_amount: "$VALUE|Y0=$"
 renewable_energy_infra_resource: "£resources_strip|$FRAME$"
 # 10
 fuel_silo: "Strategic Resource Reserve"
 fuel_silo_plural: "Strategic Resource Reserves"
 fuel_silo_desc: "The §YStrategic Resource Reserve§! is an amalgamation of warehouses, dry storage, and other §YFuel§! like storage. This building provides your nation with more room for stockpiling §HFuel§! and §HResources§!.\n\nNOTE: §YResource Storage§! has an engine limitation to where if you are on §Y$export_economy$§! or §Y$globalized_trade_economy$§! you may end up sending more resources to export then to your needed production lines. If you need to start to withdraw from storage it is recommended you switch to §Y$mixed_economy$§! or lower.\n"
 # 11
 offices: "Office Sector"
 offices_plural: "Office Sectors"
 offices_desc: "The §YOffice Sectors§! represents all the other industries of the economy beyond the extraction and heavy industries. These includes financial, customer, information technology, retail services and so much more.\n\nProvides the state with:\nBase Number of Required Workers: §Y473K§!\nBase GDP Output per §YOffice Sector§!: $§Y50 Billion§!\nBase Energy Consumption: §R-0.25§! GW" #\n\nFuel per day (K): §R-240.00§!
 # 16 - Railways
 rail_way_plural: "Railways"
 # 17 - Fossil Fuel Powerplant
 fossil_powerplant: "Fossil Fuel Powerplant"
 fossil_powerplant_plural: "Fossil Fuel Powerplants"
 fossil_powerplant_desc: "§YFossil Fuel Powerplants§! is a catch-all for all fossil-based thermoelectric energy sources. These include but are not limited to; coal, natural gas and oil. §YFossil Fuel Powerplants§! will idle if energy generation is higher than consumption.\n\nProvides the state with:\nBase Number of Required Workers: §Y7.5K§!\nBase GDP Output per §YFossil Fuel Powerplant§!: $§Y1.7 Billion§!\nBase Power Gain: §G+2§! GW\n"
 fossil_powerplant_amount: "$VALUE|Y0=$"
 fossil_powerplant_resource: "£resources_strip|$FRAME$"
 # 18 - Commercialized Agriculture District
 agriculture_district: "Commercialized Agriculture District"
 agriculture_district_plural: "Commercialized Agriculture Districts"
 agriculture_district_desc: "§YCommercialized Agriculture Districts§! represents a catch-all for all non-subsistence Agriculture within our nation. It includes Agro-Industry, arable land, grain silos, butcherhouses and more.\n\nProvides the state with:\nBase Number of Required Workers: §Y188K§!\nBase GDP Output per §YCommercialized Agriculture District§!: $§Y25 Billion§!\nBase Energy Consumption: §R-0.10§! GW\n§YFuel Gain§! from States: 8\n§YLocal Supplies§!: 1.5%\n"
 agriculture_district_amount: "$VALUE|Y0=$"
 # 19 - Missile Launch Sites
 rocket_site: "Missile Launch Site"
 rocket_site_plural: "Missile Launch Sites"
 rocket_site_desc: "§YMissile Launch Sites§! represent a catch-all for all theatre level missile equipment ranging from §YSurface-Air Missiles§! to §YIntercontinental Ballistic Missiles§!. It provides the state with the ability to deploy these strategic assets in our strategic air zones to either aid in our air defense, or provide offensive capabilities."
 # New Buildings
 nuclear_facility: "Civilian R&D Facility"
 nuclear_facility_plural: "Civilian R&D Facilities"
 nuclear_facility_desc: "A §YCivilian R&D Facility§! includes all types of special projects relating to the civilian industrial capacity, nuclear facilities, and more."
 air_facility: "Aerodynamics & Avionics Facility"
 air_facility_desc: "Experimental Facilities for Aerodynamics and Avionics allow you to start research projects for aircraft, advanced rockets, related electronics and space projects."
 naval_facility_desc: "Experimental Facilities for Naval Engineering allow you to start research projects related to Surface Ships and Submarines.\nA Naval Engineering can only be created in a coastal province."
 stronghold_network: "State-Wide Defensive Network"
 stronghold_network_plural: "State-Wide Defensive Networks"
 stronghold_network_desc: "An extensive defensive network consisting of tunnels, hardpoints, trenches, bomb shelters, weapon dumps and pre-planned demolition sites give the defenders a decisive edge against any attacker."

 microchip_plant: "Microchip Plant"
 microchip_plant_plural: "Microchip Plants"
 microchip_plant_desc: "Production plant that converts Technology Metals and Precious Metals into Microchips, for use by both industrial and military needs.\n\nProvides the state with:\nBase Number of Required Workers: §Y37.5K§!\nBase GDP Output per §YMicrochip Plant§!: $§Y32 Billion§!\nBase Energy Consumption: §R-0.75§! GW\n16 §YMicrochip§! Production\n\n§YMicrochips§! command the highest per-unit market price, generating significant cash income on surplus exports.\n\nCosts:\n3 §YTechnology Metals§!\n2 §YPrecious Metals§!"
 composite_plant: "Composite Plant"
 composite_plant_plural: "Composite Plants"
 composite_plant_desc: "Production plant that combines Oil, Rubber, and Precious Metals into Composites, for use in both scientific, military, and industrial workers.\n\nProvides the state with:\nBase Number of Required Workers: §Y37.5K§!\nBase GDP Output per §YComposite Plant§!: $§Y28 Billion§!\nBase Energy Consumption: §R-0.8§! GW\n16 §YAdvanced Composite§! Production\n\n§YComposites§! sell at one of the highest per-unit market prices, generating strong cash income on surplus exports.\n\nCosts:\n1 §YOil§!\n1 §YRubber§!\n1 §YPrecious Metals§!"
 synthetic_refinery_desc: "This building provides the state with industry for production of synthetic rubber and some additional fuel production capability.\n\nProvides the state with:\nBase Number of Required Workers: §Y184K§!\nBase GDP Output per §YSynthetic Refinery§!: $§Y10 Billion§!\nBase Energy Consumption: §R-0.2§! GW\n\nProduces §YRubber§! at standard market rates, with surplus generating cash income on top of corporate tax.\n"

 enrichment_facility: "Nuclear Enrichment Facility"
 enrichment_facility_plural: "Nuclear Enrichment Facilities"
 enrichment_facility_desc: "Enrichment facilities take in Uranium and enrich it for use in nuclear reactors and to some extent nuclear weaponry."

 rail_terminal: "Rail Terminal"
 rail_terminal_plural: "Rail Terminals"
 rail_terminal_desc: "A state served by a dense terminal network moves both people and goods faster, so factories see steadier inputs, workers reach jobs more reliably, and the surrounding economy gains room to expand."

 # Building Construction Speed Interface
 show_construction_speed: "When checked, you can see the current £construction_speed_texticon §YConstruction Speed Bonus§! for each §YBuilding Type§!\n\nThis modifier shows only the building specific modifier. Its does not take into account the §YGlobal £construction_speed_texticon Construction Speed.§!"

 # MD-original landmarks
 landmark_kaaba: "Kaaba"
 landmark_kaaba_plural: "$landmark_kaaba$"
 landmark_kaaba_desc: "The Kaaba, a sacred cube-shaped structure at the heart of Mecca's Masjid al-Haram, stands as the holiest site in Islam. Draped in black silk adorned with golden calligraphy, it serves as the qibla, the direction toward which Muslims worldwide turn in prayer. This ancient sanctuary, known as the House of God, embodies centuries of faith, pilgrimage, and Islamic history, symbolizing the unity of the Muslim ummah.\n\n§YLandmark Kaaba§! generates tourism income based on the total population of Arabic states. The exact amount can be viewed in the §YEconomic Preview§!."

 landmark_milad: "Milad Tower"
 landmark_milad_plural: "$landmark_milad$"
 landmark_milad_desc: "Milad Tower, or Borj-e Milad, has roots in Iran's pre-revolutionary period, with initial plans dating back to the 1970s. After the 1979 Iranian Revolution, those early plans were shelved amidst shifting political priorities. The vision was revived in the late 1990s, and construction began in 2000, aligning with Iran's new focus on development and modernization. Its design combines elements of Iranian heritage with contemporary engineering, making it a striking emblem of both historical continuity and the country's evolving identity. Today, the tower stands as a multifunctional complex and a prominent cultural landmark, offering Tehran's residents and visitors panoramic views of the city and the distant Alborz mountains."

 landmark_domeofrock: "Dome of the Rock"
 landmark_domeofrock_plural: "$landmark_domeofrock$"
 landmark_domeofrock_desc: "The Dome of the Rock is a renowned Islamic shrine, famous for the golden dome overlooking Jerusalem's Old City. Built in the seventh century, it stands on the Haram al-Sharif, also known as the Temple Mount, a site sacred to both Muslims and Jews. The shrine enshrines the Foundation Stone, which Muslims believe marks where the Prophet Muhammad ascended to heaven and which Jews believe is the site of the Holy of Holies of the ancient Jewish Temple."

 landmark_goldengate: "Golden Gate Bridge"
 landmark_goldengate_plural: "$landmark_goldengate$"
 landmark_goldengate_desc: "Completed in 1937, the Golden Gate Bridge spans the strait between San Francisco Bay and the Pacific Ocean, connecting the city to the Marin Headlands. Its distinctive International Orange towers and long suspended span made it the longest bridge of its kind in the world at the time of its opening, and it remains one of the most recognizable structures in the United States."

 landmark_UScongress: "U.S. Capitol"
 landmark_UScongress_plural: "$landmark_UScongress$"
 landmark_UScongress_desc: "The U.S. Capitol stands at the east end of the National Mall in Washington, D.C., housing the chambers of the Senate and the House of Representatives. Its neoclassical design and central dome have made it the most recognizable seat of American legislative power, anchoring a corridor that includes the Library of Congress, the Supreme Court, and the Smithsonian Institution's museum complex."

 landmark_fuji: "Mount Fuji"
 landmark_fuji_plural: "$landmark_fuji$"
 landmark_fuji_desc: "Mount Fuji, at 3,776 meters the highest peak in Japan, is an active stratovolcano on Honshu visible from Tokyo on clear days. Long considered sacred in Shinto belief and a defining motif in Japanese art, it is also a UNESCO World Heritage Site. Its near-perfect conical silhouette and surrounding lake region draw hundreds of thousands of climbers and tourists every year."

 landmark_giza: "Pyramids of Giza"
 landmark_giza_plural: "$landmark_giza$"
 landmark_giza_desc: "Built during the Old Kingdom of Egypt as monumental tombs for the pharaohs, the Pyramids of Giza stand on the outskirts of Cairo. The Great Pyramid, constructed for Pharaoh Khufu, is the last surviving structure of the Seven Wonders of the Ancient World. The complex, together with the Sphinx, remains one of Egypt's most-visited landmarks and a centerpiece of the country's tourism economy."

 landmark_shuttle: "Kennedy Space Center"
 landmark_shuttle_plural: "$landmark_shuttle$"
 landmark_shuttle_desc: "Kennedy Space Center, on Florida's Atlantic coast, serves as the primary launch site for NASA's human spaceflight missions. It features facilities like the iconic Vehicle Assembly Building, where rockets are prepared for launch, and Launch Complex 39, the historic departure point for the Apollo and Space Shuttle programs. The center remains a hub of innovation and exploration, supporting both government and commercial launches."

 landmark_shuttle_launch: "Kennedy Space Center"
 landmark_shuttle_launch_plural: "$landmark_shuttle_launch$"
 landmark_shuttle_launch_desc: "Kennedy Space Center, on Florida's Atlantic coast, serves as the primary launch site for NASA's human spaceflight missions. It features facilities like the iconic Vehicle Assembly Building, where rockets are prepared for launch, and Launch Complex 39, the historic departure point for the Apollo and Space Shuttle programs. The center remains a hub of innovation and exploration, supporting both government and commercial launches."

 landmark_buran: "Baikonur Cosmodrome"
 landmark_buran_plural: "$landmark_buran$"
 landmark_buran_desc: "The Baikonur Cosmodrome, on the steppes of southern Kazakhstan, is the world's oldest and largest operational spaceport. Established in 1955, it has been the launch site for milestone Soviet and Russian missions, including the first human spaceflight by Yuri Gagarin aboard Vostok 1. Russia continues to lease the facility from Kazakhstan and uses it for crewed Soyuz launches to the International Space Station."

 landmark_ICBMsilominot: "Minot AFB"
 landmark_ICBMsilominot_plural: "$landmark_ICBMsilominot$"
 landmark_ICBMsilominot_desc: "Minot Air Force Base's missile complex consists of an extensive network of underground silos housing intercontinental ballistic missiles, scattered across the North Dakota plains. The silos are hardened against nuclear strike and heavily guarded, maintained on continuous alert, forming the land-based leg of the United States' nuclear triad."

 landmark_ICBMsiloyasny: "Yasny Missile Base"
 landmark_ICBMsiloyasny_plural: "$landmark_ICBMsiloyasny$"
 landmark_ICBMsiloyasny_desc: "The Yasny missile base, near Dombarovsky in Russia's Orenburg region, is one of the principal silo fields of the Strategic Rocket Forces. Built during the Cold War, it hosts heavy ICBMs in hardened underground silos and forms a critical component of Russia's nuclear deterrent."

 landmark_zenobia_wall: "Zenobia Defense Line"
 landmark_zenobia_wall_plural: "$landmark_zenobia_wall$"
 landmark_zenobia_wall_desc: "A heavily fortified line stretching across southern Egypt and the western desert. Concrete walls, bunker complexes, and pre-sited artillery anchor the Zenobia Line, raised to halt the Chimera advance from sub-Saharan breach zones."

 # New vanilla landmarks integrated into MD
 landmark_hagia_sophia_plural: "$landmark_hagia_sophia$"
 landmark_hagia_sophia_desc: "Originally built as a Byzantine cathedral in 537, the Hagia Sophia became Istanbul's principal Ottoman mosque after the city's conquest in 1453. It served as a secular museum through much of the Turkish Republic's history. Its massive central dome and Byzantine mosaics remain among the most influential works of religious architecture ever built, drawing millions of visitors to Istanbul each year."

 landmark_forbidden_city_desc: "The walled palace complex at the heart of Beijing served as the imperial residence of the Ming and Qing dynasties for nearly five centuries. Today it houses the Palace Museum, holding one of the world's most important collections of Chinese art and artifacts. The Forbidden City is the country's most-visited cultural site and a UNESCO World Heritage Site, standing as the foremost symbol of Chinese civilization."

 landmark_tokyo_imperial_palace_desc: "The primary residence of the Emperor of Japan since the Meiji Restoration, standing on the site of the former Edo Castle in the heart of Tokyo. The palace and its grounds represent the continuity of the world's oldest hereditary monarchy. Public access is restricted, but the East Gardens and major imperial ceremonies draw substantial tourism every year."

 landmark_taj_mahal_plural: "$landmark_taj_mahal$"
 landmark_taj_mahal_desc: "Commissioned in 1632 by Mughal emperor Shah Jahan as a mausoleum for his wife Mumtaz Mahal, the Taj Mahal is the finest surviving example of Mughal architecture. Its white marble facade, intricate inlay work, and symmetrical gardens have made it a UNESCO World Heritage Site and one of the most visited monuments on Earth, drawing millions of visitors to Agra each year."

 landmark_prague_castle: "Prague Castle"
 landmark_prague_castle_desc: "The largest ancient castle complex in the world by area, Prague Castle has served as the seat of Bohemian kings, Holy Roman emperors, and now the President of the Czech Republic. Within its walls stand St. Vitus Cathedral and centuries of art from across Central Europe, making the castle the country's most-visited cultural site."

 landmark_bojnice_castle: "Bojnice Castle"
 landmark_bojnice_castle_desc: "A romantic neo-Gothic restoration of a medieval Slovak fortress, Bojnice Castle was rebuilt in the late nineteenth century under Count János Pálffy in the style of the French Loire châteaux. Today it is one of the most-visited cultural sites in Slovakia, its turreted silhouette and surrounding park serving as a centerpiece of Slovak heritage tourism."

 landmark_sadabad_complex: "Sadabad Complex"
 landmark_sadabad_complex_plural: "$landmark_sadabad_complex$"
 landmark_sadabad_complex_desc: "A sprawling palace complex in the foothills north of Tehran, originally built under the Qajars and dramatically expanded by the Pahlavi shahs. Following the 1979 revolution the complex was nationalized, and today it operates as a network of state museums housing royal collections, Iranian art, and natural history."

 # Replace 1936-themed vanilla descriptions for existing MD landmarks
 landmark_hofburg_palace_desc: "The Hofburg, in the heart of Vienna, served for centuries as the principal imperial palace of the Habsburg dynasty. Today its halls house the offices of the Austrian Federal President, the Spanish Riding School, the Imperial Treasury, and several major museums. It remains one of Vienna's defining landmarks and a centerpiece of Austrian cultural tourism."

 landmark_berlin_reichstag_desc: "The Reichstag building on Platz der Republik has stood at the political center of Berlin for over a century. Heavily damaged in 1933 and again during the Second World War, it was restored after reunification under Norman Foster's redesign and reopened in 1999 as the seat of the Bundestag, the German federal parliament. Its glass dome has become a defining symbol of modern German democracy and a major attraction in central Berlin."

 landmark_great_wall: "Great Wall of China"
 landmark_great_wall_plural: "$landmark_great_wall$"
 landmark_great_wall_desc: "Constructed over more than two thousand years across multiple dynasties, the Great Wall of China stretches over 13,000 miles along the country's northern borders. Built to defend against nomadic invasions and regulate trade along the Silk Road, the wall represents one of the most ambitious construction projects in human history. Today it stands as China's most recognizable symbol and a UNESCO World Heritage Site, drawing millions of visitors annually to experience its winding path through mountains and deserts."

 landmark_machu_picchu: "Machu Picchu"
 landmark_machu_picchu_plural: "$landmark_machu_picchu$"
 landmark_machu_picchu_desc: "Built around 1450 during the reign of Inca emperor Pachacuti, Machu Picchu stands as a citadel in the Eastern Cordillera of southern Peru. Hidden high in the Andes Mountains, this masterwork of Inca engineering remained unknown to the Spanish conquistadors and was lost to the outside world until American historian Hiram Bingham brought it to international attention in 1911. Today it is Peru's most-visited archaeological site and a UNESCO World Heritage Site, drawing trekkers and tourists from around the world."

 landmark_chichen_itza: "Chichen Itza"
 landmark_chichen_itza_plural: "$landmark_chichen_itza$"
 landmark_chichen_itza_desc: "One of the largest pre-Columbian settlements on the Yucatan Peninsula, Chichen Itza flourished from roughly 600 to 1200 CE as a major center of the Maya civilization. The site showcases a blend of pure Maya and Toltec-influenced architecture, with the iconic pyramid of Kukulkan dominating its ceremonial center. Designated a UNESCO World Heritage Site in 1988, it is Mexico's most-visited archaeological monument and ranks among the most-visited sites in all of Mesoamerica."

 landmark_st_peters: "St. Peter's Basilica"
 landmark_st_peters_plural: "$landmark_st_peters$"
 landmark_st_peters_desc: "Built between 1506 and 1626, St. Peter's Basilica stands at the heart of Vatican City, the spiritual and administrative center of the Roman Catholic Church. Its massive dome, designed by Michelangelo, dominates the Vatican skyline and makes it one of the world's largest churches by interior volume. The basilica houses countless works of Renaissance and Baroque art, and its forecourt plaza remains the site of papal ceremonies and gatherings of the global Catholic faithful."

 landmark_acropolis: "Acropolis of Athens"
 landmark_acropolis_plural: "$landmark_acropolis$"
 landmark_acropolis_desc: "Perched on a rocky hill overlooking Athens, the Acropolis has served as a religious and civic center since ancient times. The Parthenon, built between 447 and 432 BCE as a temple to Athena, stands as the finest example of Classical Greek architecture ever constructed. Damaged by wars, occupation, and pollution over the centuries, the Acropolis and its monuments remain Greece's most-visited landmark and a UNESCO World Heritage Site symbolizing the birthplace of Western civilization."

 landmark_angkor_wat: "Angkor Wat"
 landmark_angkor_wat_plural: "$landmark_angkor_wat$"
 landmark_angkor_wat_desc: "Built in the early twelfth century under Khmer king Suryavarman II, Angkor Wat stands as the largest religious monument in the world by area. Constructed as a Hindu temple and later converted to a Buddhist sanctuary, its five towers and intricate stone carvings represent the pinnacle of Khmer architectural achievement. Located in northwestern Cambodia, it is the most-visited tourist attraction in Southeast Asia and a UNESCO World Heritage Site that has become the symbol of Cambodia itself."

 landmark_kiyomizu_dera: "Kiyomizu-dera"
 landmark_kiyomizu_dera_plural: "$landmark_kiyomizu_dera$"
 landmark_kiyomizu_dera_desc: "Founded in 778 on a hillside in Kyoto, Kiyomizu-dera is one of Japan's most celebrated Buddhist temples. Its main hall, rebuilt in 1633, sits on a wooden veranda that extends over a valley and offers commanding views of Kyoto below. The temple's iconic red pagoda and its position on the Higashiyama mountains have made it one of Japan's most-visited cultural sites and a UNESCO World Heritage Site, drawing pilgrims and tourists year-round."

 landmark_sydney_opera: "Sydney Opera House"
 landmark_sydney_opera_plural: "$landmark_sydney_opera$"
 landmark_sydney_opera_desc: "Completed in 1973 on Bennelong Point in Sydney Harbour, the Sydney Opera House stands as one of the world's most iconic and distinctive buildings. Designed by Danish architect Joern Utzon, its innovative shell-like roof design revolutionized modern architecture. The facility hosts over a thousand performances annually and draws millions of visitors, making it Australia's most recognizable landmark and a UNESCO World Heritage Site."

 landmark_cn_tower: "CN Tower"
 landmark_cn_tower_plural: "$landmark_cn_tower$"
 landmark_cn_tower_desc: "Completed in 1976 and standing at 553 meters, the CN Tower dominated the world's skyline as the world's tallest free-standing structure for over thirty years. Built in Toronto, Ontario, the tower was designed to withstand earthquakes, ice storms, and winds exceeding 100 miles per hour. Its observation decks and entertainment facilities draw hundreds of thousands of visitors annually, making it Canada's most-visited paid attraction."

 landmark_itaipu_dam: "Itaipu Dam"
 landmark_itaipu_dam_plural: "$landmark_itaipu_dam$"
 landmark_itaipu_dam_desc: "Completed in 1984 on the Parana River between Brazil and Paraguay, Itaipu Dam stands as one of the world's largest hydroelectric dams by power generation capacity. At its peak, it supplied about 75 percent of Paraguay's electricity and 20 percent of Brazil's power needs. The dam's construction represented a landmark of regional cooperation and engineering achievement, and today it remains a symbol of binational partnership and technological accomplishment."

 landmark_delta_works: "Delta Works"
 landmark_delta_works_plural: "$landmark_delta_works$"
 landmark_delta_works_desc: "A comprehensive system of dikes, dunes, locks, and barriers built over centuries to protect the low-lying Netherlands from the sea, the Delta Works represent humanity's longest struggle against water. Reinforced and expanded throughout the twentieth century, the system exemplifies Dutch hydraulic engineering and the national determination to reclaim and defend land below sea level. Collectively designated a UNESCO World Heritage Site in 2015, the Delta Works stand as testament to Dutch innovation and perseverance."

 landmark_oresund_bridge: "Oresund Bridge"
 landmark_oresund_bridge_plural: "$landmark_oresund_bridge$"
 landmark_oresund_bridge_desc: "Opened in 2000, the Oresund Bridge links Copenhagen, Denmark with Malmo, Sweden across the Oresund Strait. At 7.8 kilometers, it is the world's longest combined road and rail bridge serving both countries. The bridge transformed regional integration and cooperation, reducing travel time between the Nordic capitals and facilitating unprecedented labor mobility and economic exchange across the strait."

 landmark_palm_jumeirah: "Palm Jumeirah"
 landmark_palm_jumeirah_plural: "$landmark_palm_jumeirah$"
 landmark_palm_jumeirah_desc: "Completed in 2008, Palm Jumeirah is an artificial archipelago off the coast of Dubai created by dredging and land reclamation. Shaped like a palm tree when viewed from above, the development showcases Dubai's ambition to create luxury residential and resort communities on an unprecedented scale. The Palm draws international investors, residents, and tourists, symbolizing both the city's rapid modernization and its commitment to transforming its coastline."

 landmark_three_gorges: "Three Gorges Dam"
 landmark_three_gorges_plural: "$landmark_three_gorges$"
 landmark_three_gorges_desc: "Completed in 2012 on the Yangtze River in Hubei Province, the Three Gorges Dam is the world's largest power station by generating capacity. The dam stands 185 meters tall and creates a reservoir stretching over 600 kilometers upstream. Its construction required the relocation of over a million people and represented China's most ambitious engineering project of the modern era, providing renewable hydroelectric power while enabling improved navigation and flood control."

 landmark_burj_khalifa: "Burj Khalifa"
 landmark_burj_khalifa_plural: "$landmark_burj_khalifa$"
 landmark_burj_khalifa_desc: "Completed in 2010 and standing at 828 meters, the Burj Khalifa in Dubai is the world's tallest building. Its mixed-use tower contains offices, apartments, and the Armani Hotel, with observation decks attracting nearly two million visitors annually. The tower's innovative engineering, energy-efficient systems, and iconic design have made it the defining symbol of modern Dubai and a centerpiece of the city's international prestige."

 landmark_one_wtc: "One World Trade Center"
 landmark_one_wtc_plural: "$landmark_one_wtc$"
 landmark_one_wtc_desc: "Completed in 2014 in Lower Manhattan, One World Trade Center rises 541 meters to become the tallest building in the Western Hemisphere. Built as a symbol of resilience and renewal on the site of the original World Trade Center, the tower features a distinctive spire, energy-efficient design, and serves as an office complex housing major media and financial firms. Its completion marked New York's determination to rebuild and restore economic vitality to Lower Manhattan."

 landmark_shanghai_tower: "Shanghai Tower"
 landmark_shanghai_tower_plural: "$landmark_shanghai_tower$"
 landmark_shanghai_tower_desc: "Completed in 2015 and standing at 632 meters, Shanghai Tower is China's tallest building and the world's second-tallest by architectural height. Located in the Pudong district's financial center, the tower combines office space, hotels, conference facilities, and retail outlets within its distinctive twisted cylindrical form. It exemplifies Shanghai's evolution as a global financial center and symbolizes China's rapid urbanization and economic transformation in the twenty-first century."

 landmark_lotte_tower: "Lotte World Tower"
 landmark_lotte_tower_plural: "$landmark_lotte_tower$"
 landmark_lotte_tower_desc: "Completed in 2017 and standing at 555 meters, Lotte World Tower in Seoul is South Korea's tallest building. Its mixed-use design includes offices, residences, a luxury hotel, a shopping mall, and an observation deck with panoramic views of the city. The tower represents South Korea's technological and architectural prowess, anchoring the Songpa District's skyline and drawing hundreds of thousands of visitors annually."

 landmark_lhc: "Large Hadron Collider"
 landmark_lhc_plural: "$landmark_lhc$"
 landmark_lhc_desc: "The world's largest and highest-energy particle collider, the Large Hadron Collider (LHC) sits beneath the Franco-Swiss border near Geneva. Operated by CERN, the seventeen-kilometer circular tunnel accelerates protons to nearly the speed of light and smashes them together to recreate conditions microseconds after the Big Bang. The LHC's discovery of the Higgs boson in 2012 confirmed a fundamental prediction of particle physics and stands as one of humanity's greatest scientific achievements."

 landmark_iter: "ITER"
 landmark_iter_plural: "$landmark_iter$"
 landmark_iter_desc: "The International Thermonuclear Experimental Reactor (ITER), under construction in southern France near Provence, represents humanity's most ambitious fusion energy project. When operational, it will be the world's largest magnetic confinement fusion reactor, designed to demonstrate that sustained fusion reactions can generate more energy than they consume. ITER's construction involves cooperation among dozens of nations and symbolizes the international scientific community's shared commitment to developing clean, safe, unlimited fusion energy."

 # Audit: Adding missing _plural and _desc for existing 10 landmarks
 landmark_big_ben: "Big Ben"
 landmark_big_ben_plural: "$landmark_big_ben$"
 landmark_big_ben_desc: "The Great Bell within the clock tower at the Palace of Westminster in London, England, has been known colloquially as Big Ben since its installation in 1859. The iconic Gothic Revival tower, officially called the Elizabeth Tower since its 2022 renovation and restoration, stands at the north end of the Palace of Westminster and has become the most recognizable symbol of the United Kingdom. Its distinctive chimes mark each hour and have been broadcast on BBC Radio since 1924."

 landmark_cristo_redentor: "Cristo Redentor"
 landmark_cristo_redentor_plural: "$landmark_cristo_redentor$"
 landmark_cristo_redentor_desc: "Completed in 1931 atop Corcovado Mountain overlooking Rio de Janeiro, Christ the Redeemer stands as one of the world's largest Art Deco monuments. The 30-meter statue of Jesus Christ with arms outstretched has become Brazil's most recognizable symbol and a UNESCO World Heritage Site. The monument draws nearly two million visitors annually from around the world and serves as a powerful symbol of Brazilian faith and national identity."

 landmark_colosseum: "Colosseum"
 landmark_colosseum_plural: "$landmark_colosseum$"
 landmark_colosseum_desc: "Built between 72 and 80 CE in Rome under emperors Vespasian and Titus, the Colosseum is the largest amphitheater ever built and one of the finest examples of Roman engineering. Once capable of holding over 50,000 spectators, it hosted gladiatorial fights and public spectacles for nearly 400 years. Today, despite centuries of damage and decay, it remains Rome's most iconic landmark and a UNESCO World Heritage Site drawing millions of visitors annually."

 landmark_kremlin: "Kremlin"
 landmark_kremlin_plural: "$landmark_kremlin$"
 landmark_kremlin_desc: "The fortified complex at the heart of Moscow, the Kremlin has served as the political and spiritual center of Russian power for over five centuries. Its walls enclose the residence of the Russian President, multiple cathedrals, government offices, and the famous Red Square. The Kremlin's distinctive red brick walls and multiple towers make it one of the world's most recognizable symbols of state authority and Russian cultural heritage."

 landmark_statue_of_liberty: "Statue of Liberty"
 landmark_statue_of_liberty_plural: "$landmark_statue_of_liberty$"
 landmark_statue_of_liberty_desc: "A gift from France to the United States dedicated in 1886, the Statue of Liberty stands on Liberty Island in New York Harbor as a colossal copper monument to freedom. Designed by French sculptor Frederic Auguste Bartholdi, the 93-meter statue has greeted millions of immigrants arriving by ship and has become a worldwide symbol of liberation and democracy. The statue and Ellis Island together form a UNESCO World Heritage Site drawing over three million visitors annually."

 landmark_eiffel_tower: "Eiffel Tower"
 landmark_eiffel_tower_plural: "$landmark_eiffel_tower$"
 landmark_eiffel_tower_desc: "Built for the 1889 World's Fair in Paris, the Eiffel Tower stands as one of the world's most iconic structures and an enduring symbol of France. Designed by Gustave Eiffel, the wrought-iron lattice tower reaches 330 meters into the Parisian sky and has become an inseparable part of the city's identity. The tower draws nearly seven million visitors annually, making it the world's most-visited paid monument."
